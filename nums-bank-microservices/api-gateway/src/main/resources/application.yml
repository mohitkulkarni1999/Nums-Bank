server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        # Allow up to 90 seconds for Render cold-start wakeup
        connect-timeout: 10000
        response-timeout: 90s
        pool:
          type: elastic
          max-idle-time: 30s
      default-filters:
        # Strip CORS headers from downstream services — gateway adds its own clean set
        - RemoveResponseHeader=Access-Control-Allow-Origin
        - RemoveResponseHeader=Access-Control-Allow-Credentials
        - RemoveResponseHeader=Access-Control-Allow-Methods
        - RemoveResponseHeader=Access-Control-Allow-Headers
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://nums-bank.vercel.app"
              - "http://localhost:5173"
              - "http://localhost:4173"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS","PATCH"]
            allowedHeaders: ["Authorization","Content-Type","Cache-Control","X-Requested-With"]
            exposedHeaders: ["Authorization"]
            allowCredentials: true
            maxAge: 3600
      routes:
        # ── Auth Service ──────────────────────────────────
        - id: auth-service
          uri: https://auth-service-o3e7.onrender.com
          predicates:
            - Path=/api/auth/**

        # ── Account Service ───────────────────────────────
        - id: account-service
          uri: https://account-service-8kwx.onrender.com
          predicates:
            - Path=/api/accounts/**

        # ── Transaction Service ───────────────────────────
        - id: transaction-service
          uri: https://transaction-service-khc7.onrender.com
          predicates:
            - Path=/api/transactions/**

        # ── Loan Service ──────────────────────────────────
        - id: loan-service
          uri: https://loan-service-gkpk.onrender.com
          predicates:
            - Path=/api/loans/**

        # ── Admin Service ─────────────────────────────────
        - id: admin-service
          uri: https://admin-service-9a29.onrender.com
          predicates:
            - Path=/api/admin/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN
