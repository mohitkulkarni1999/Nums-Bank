version: '3.8'

services:
  account-service:
    build:
      context: ./nums-bank-microservices/account-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  transaction-service:
    build:
      context: ./nums-bank-microservices/transaction-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  loan-service:
    build:
      context: ./nums-bank-microservices/loan-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  admin-service:
    build:
      context: ./nums-bank-microservices/admin-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
